# Auto-discovered by sysbuild for the "mcuboot" child image (see
# sysbuild/<image>.conf lookup in sysbuild_extensions.cmake).
#
# MCUboot's own default config wants CONFIG_UART_CONSOLE against a physical
# UART, but xiao_ble's zephyr,console chosen node points at the USB CDC-ACM
# virtual UART instead - undefined __device_dts_ord_* at link time
# (uart_console.c) without USB pulled in for this image too. Same class of
# problem the app image already worked around for itself (see prj.conf) -
# simplest fix here is just no console for the bootloader either; nothing
# is ever attached to see it anyway (see PROGRESS.md - no physical console
# on this node).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n
