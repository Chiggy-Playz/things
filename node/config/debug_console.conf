# Add this as an extra Kconfig fragment when you need a wired serial console
# for debugging - prj.conf disables the console/UART entirely by default to
# save power (measured ~470uA saved with it off, on a device with no console
# ever physically connected in normal operation). Re-enables what prj.conf
# turns off.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
