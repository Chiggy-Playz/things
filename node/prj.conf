CONFIG_BUILD_OUTPUT_UF2=y

# OpenThread - Sleepy End Device (present on every node by default)
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=500
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_SRP_CLIENT=y

# Reboot on any unrecoverable fault (stack overflow, hard fault, etc.)
# instead of Zephyr's default silent halt. Without this, any crash is a
# permanent hang requiring a manual power cycle - no watchdog either, so
# there's currently zero self-recovery on this node.
CONFIG_RESET_ON_FATAL_ERROR=y

# Power management - CONFIG_PM (system-level) removed 2026-08-16. nRF52 never
# selects HAS_PM (see soc/nordic/nrf52/Kconfig) - CONFIG_PM is silently forced
# back to n on this SoC regardless of this file, which is exactly the
# "assigned y, but got n" Kconfig warning that flagged this. Confirmed by
# measurement too: console-off + dropping CONFIG_PM only moved idle draw from
# ~8mA to 7.44mA, nowhere near the µA range PM would have implied if it worked.
#
# Real culprit: this board's onboard QSPI NOR flash (p25q16h, see
# node/boards/xiao_ble_nrf52840.overlay) is unused by this app (settings live
# on internal flash - see pm_static.yml) but stays powered/active by default.
# CONFIG_PM_DEVICE_RUNTIME is independent of CONFIG_PM/HAS_PM - it's the
# explicit get/put-refcounted path, not the idle-triggered one - and the
# nrf_qspi_nor driver already calls it around every access + implements a
# real suspend (enter deep-power-down, pinctrl sleep state). Combined with
# the `zephyr,pm-device-runtime-auto` DT property on the flash node, it
# should settle into DPD after the one-time init access and stay there.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# No physical console is ever connected to this node (reverted early in the
# project) - CONFIG_PRINTK=y was still keeping the UART peripheral powered
# for a console nothing listens to. Nordic's own power-optimization guide
# measures this at ~470uA average just for that - pure waste here.
# Also disable the console subsystem itself (board default still wires it to
# a UART device) - otherwise it dangles a reference to the now-gone UART
# device at link time.a
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# 2026-08-16: the above three did NOT touch the real console path on this
# board. xiao_ble's devicetree wires `zephyr,console` to a USB CDC-ACM
# virtual UART, not a physical one (boards/common/usb/cdc_acm_serial.dtsi) -
# a separate subsystem gated by different Kconfig, defaulted on regardless of
# CONFIG_SERIAL/CONSOLE: `USB_DEVICE_STACK_NEXT` and
# `CDC_ACM_SERIAL_INITIALIZE_AT_BOOT` both `default y if !MCUBOOT` (see
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig), and this build has no
# MCUboot. So the full USB device stack + its thread + the CDC-ACM class have
# been running through every measurement so far (~8mA, then 7.44mA, then
# 7.45mA) completely unaffected by any fix above - this is very likely the
# real dominant draw, not QSPI. Explicit override, since a plain default
# can't be beaten any other way:
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Stack / heap for networking
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Battery voltage over CoAP GET /battery - see node/lib/battery/battery.c
# and node/boards/xiao_ble_nrf52840.overlay for the VDD-as-battery ADC setup.
CONFIG_ADC=y
